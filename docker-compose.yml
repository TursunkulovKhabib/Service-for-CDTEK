x-app: &app
  build: .
  image: contacts-app:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    PHOTO_ROOT: /data/photos
  volumes:
    - contacts-photos:/data/photos
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    container_name: contacts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contacts}
      POSTGRES_USER: ${POSTGRES_USER:-contacts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contacts}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - contacts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contacts} -d ${POSTGRES_DB:-contacts}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: contacts-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    <<: *app
    container_name: contacts-app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py load_companies &&
             python manage.py collectstatic --noinput &&
             gunicorn serviceforcdtek.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    container_name: contacts-worker
    command: celery -A serviceforcdtek worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  beat:
    <<: *app
    container_name: contacts-beat
    command: celery -A serviceforcdtek beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  contacts-pgdata:
  contacts-photos:
